name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The deck runtime and editor app in src/opendeck/_web/ are built from web/
      # and are not tracked in git.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web runtime
        working-directory: web
        run: npm ci && npm run build
      - name: Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov
      # PDF export and the end-to-end tests drive Google Chrome through Playwright
      # (channel="chrome"); it is preinstalled on GitHub's Ubuntu runners.
      - name: Check Google Chrome
        run: google-chrome --version
      - name: Test
        run: pytest --cov=opendeck --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The deck runtime and editor app in src/opendeck/_web/ are built from web/
      # and are not tracked in git.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web runtime
        working-directory: web
        run: npm ci && npm run build
      - run: pip install build
      - name: Build sdist and wheel
        run: python -m build
