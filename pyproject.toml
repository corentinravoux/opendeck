[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opendeck"
dynamic = ["version"]
description = "Free local HTML slide editor: offline decks with maths, PDF and HTML export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Corentin Ravoux" }]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55,<2",
]
keywords = ["slides", "presentation", "reveal.js", "katex", "offline", "editor"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Presentation",
]

[project.urls]
Homepage = "https://github.com/corentinravoux/opendeck"
Issues = "https://github.com/corentinravoux/opendeck/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
opendeck = "opendeck.cli:main"

[tool.setuptools.dynamic]
version = { attr = "opendeck.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["examples: uses the real decks in Slides_deck/examples (skipped when absent)"]
