[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opendeck"
dynamic = ["version"]
description = "Free local HTML slide editor: offline decks with maths, PDF and HTML export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Corentin Ravoux" }]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.55,<2",
    "starlette>=1.0,<2",
    "uvicorn>=0.30",
    "PySide6>=6.8",
    "pillow>=10",
    "numpy>=1.26",
    "scipy>=1.11",
]
keywords = ["slides", "presentation", "reveal.js", "katex", "offline", "editor"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Presentation",
]

[project.urls]
Homepage = "https://github.com/corentinravoux/opendeck"
Issues = "https://github.com/corentinravoux/opendeck/issues"

[project.optional-dependencies]
dev = ["pytest", "httpx2", "ruff"]

[project.scripts]
opendeck = "opendeck.cli:main"

[tool.setuptools.dynamic]
version = { attr = "opendeck.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opendeck = ["_web/**/*", "shell/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["examples: uses the real decks in Slides_deck/examples (skipped when absent)"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.bumpversion]
current_version = "0.0.1"
commit = true
tag = true
tag_name = "v{new_version}"
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "src/opendeck/__init__.py"
