<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>opendeck</title>
<script>
  // the chrome theme, set before the first paint (see theme.ts)
  try {
    var t = localStorage.getItem("opendeck-theme");
    document.documentElement.dataset.theme = t === "light" || t === "dark" ? t
      : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.tsx"></script>
</body>
</html>
